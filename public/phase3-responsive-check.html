<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temporary responsive QA</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; font-family: system-ui, sans-serif; color: #222; }
    h1 { margin: 0 0 8px; font-size: 18px; }
    p { margin: 0 0 12px; font-size: 13px; }
    iframe { display: block; box-sizing: content-box; width: 375px; height: 900px; max-width: 100%; border: 1px solid #bbb; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Temporary 375px responsive QA</h1>
  <p>Same-origin employee workspace preview.</p>
  <iframe title="Employee workspace at 375 pixels" src="/workspace/employees"></iframe>
</body>
</html>
